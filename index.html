<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video clip</title>
<style>
  html, body { margin: 0; height: 100%; background: #1F2328; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // Reads ?v=VIDEO_ID&s=START&e=END and embeds the clip.
  var p = new URLSearchParams(location.search);
  var start = parseInt(p.get('s'), 10) || 0;
  var end = parseInt(p.get('e'), 10) || 0;
  var src = 'https://www.youtube.com/embed/' + encodeURIComponent(p.get('v') || '')
          + '?start=' + start
          + (end > 0 ? '&end=' + end : '')
          + '&autoplay=1&rel=0';
  var f = document.createElement('iframe');
  f.src = src;
  f.allow = 'autoplay; encrypted-media; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
</script>
</body>
</html>
