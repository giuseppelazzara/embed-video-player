<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video clip</title>
<style>
  html, body { margin: 0; height: 100%; background: #1F2328; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // Uso: ?v=VIDEO_ID&start=..&end=..&altri_parametri_youtube
  var p = new URLSearchParams(location.search);
  var id = p.get('v') || '';
  p.delete('v');
  if (!parseInt(p.get('end'), 10)) p.delete('end');   // end=0 o vuoto = fino alla fine
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?' + p.toString();
  f.allow = 'autoplay; encrypted-media; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
</script>
</body>
</html>
